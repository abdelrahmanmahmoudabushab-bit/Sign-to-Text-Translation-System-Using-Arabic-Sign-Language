# ============================================================================
#  Signo — Nginx Reverse Proxy Configuration
#  Routes traffic from port 80 → Django/Gunicorn on port 8000
# ============================================================================

upstream signo_backend {
    server signo-web:8000;
}

server {
    listen 80;
    server_name _;

    # ── Performance Tuning ──
    client_max_body_size 50M;         # Allow large video uploads
    proxy_read_timeout 120s;          # VLM inference can take time
    proxy_connect_timeout 10s;
    proxy_send_timeout 30s;

    # ── Gzip Compression ──
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;
    gzip_min_length 256;

    # ── Main Application ──
    location / {
        proxy_pass http://signo_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support (if needed in future)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # ── Serve uploaded media files directly (bypass Django) ──
    location /media/ {
        alias /app/media/;
        expires 1h;
        add_header Cache-Control "public, immutable";
    }

    # ── Static files ──
    location /static/ {
        alias /app/staticfiles/;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # ── Health check endpoint ──
    location /health {
        access_log off;
        proxy_pass http://signo_backend;
    }
}
